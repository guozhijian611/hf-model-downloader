name: Build Multi-Platform

# Why workflow_call exists:
# Releases created by GITHUB_TOKEN do NOT cascade into other workflows
# (release:published / workflow_dispatch via gh often 403). Semantic Release
# therefore calls this workflow directly after a successful publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2.0)"
        required: true
        type: string
      version:
        description: "Version without v prefix (e.g., 0.2.0)"
        required: true
        type: string
      include_intel:
        description: "Also build Intel macOS (macos-13; may queue a long time)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.8.1)"
        required: true
        type: string
      version:
        description: "Version without v prefix (e.g., 0.8.1)"
        required: true
        type: string
      include_intel:
        description: "Also build Intel macOS (optional; may starve on runners)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  # One build pipeline per release tag (avoid colliding runs on main).
  group: build-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release tag / version
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "❌ Missing release tag (inputs.release_tag or github.event.release.tag_name)"
            exit 1
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="${VERSION#v}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

  build-macos-arm64:
    needs: resolve-meta
    runs-on: macos-latest # ARM64
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-meta.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run smoke tests
        run: make test

      - name: Build DMG (ARM64)
        run: |
          echo "Building for ARM64 architecture..."
          make clean build dmg
          echo "Build completed, checking output:"
          ls -la dist/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.resolve-meta.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Uploading ARM64 DMG to release ${RELEASE_TAG}..."
          test -f dist/hf-model-downloader-arm64.dmg
          gh release upload "$RELEASE_TAG" \
            dist/hf-model-downloader-arm64.dmg \
            --clobber
          echo "ARM64 DMG uploaded successfully"

  # Intel Mac runners are often starved and can queue for hours, blocking the
  # whole release. Disabled by default; enable via include_intel input.
  build-macos-x86:
    needs: resolve-meta
    if: ${{ inputs.include_intel == true }}
    runs-on: macos-13 # Intel Mac
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-meta.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run smoke tests
        run: make test

      - name: Build DMG (x86_64)
        run: |
          echo "Building for x86_64 architecture..."
          make clean build dmg
          echo "Build completed, checking output:"
          ls -la dist/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.resolve-meta.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Uploading x86_64 DMG to release ${RELEASE_TAG}..."
          test -f dist/hf-model-downloader-x86_64.dmg
          gh release upload "$RELEASE_TAG" \
            dist/hf-model-downloader-x86_64.dmg \
            --clobber
          echo "x86_64 DMG uploaded successfully"

  build-windows:
    needs: resolve-meta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-meta.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Setup make for Windows
        run: choco install make

      - name: Install dependencies
        run: make install

      - name: Run smoke tests
        run: make test

      - name: Build Windows package
        run: |
          echo "Building for Windows..."
          make clean build
          echo "Build completed, checking output:"
          dir dist\
          dir *.zip

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.resolve-meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading Windows package to release ${RELEASE_TAG}..."
          ls -la dist/ || true
          ls -la *.zip 2>/dev/null || true

          if [ -f "hf-model-downloader-windows-x86_64.zip" ]; then
            ZIP="hf-model-downloader-windows-x86_64.zip"
          elif [ -f "dist/hf-model-downloader-windows-x86_64.zip" ]; then
            ZIP="dist/hf-model-downloader-windows-x86_64.zip"
          else
            echo "No Windows package found"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "$ZIP" --clobber
          echo "Windows zip uploaded successfully ($ZIP)"

  trigger-homebrew-update:
    needs: [resolve-meta, build-macos-arm64, build-macos-x86]
    # Skip when Intel build was not requested (needs.x86 is skipped).
    if: ${{ always() && needs.build-macos-arm64.result == 'success' && needs.build-macos-x86.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-meta.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Verify Release Assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.resolve-meta.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Checking release assets for ${RELEASE_TAG}..."
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q "hf-model-downloader-arm64.dmg"
          echo "$assets" | grep -q "hf-model-downloader-x86_64.dmg"
          echo "Required DMG files are present"

      - name: Update Homebrew Cask
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "⚠️ No token available; skip Homebrew update"
            exit 0
          fi
          echo "Version: $VERSION"
          make update-homebrew
